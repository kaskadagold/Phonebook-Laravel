name: phonebook-laravel
services:
  nginx:
    image: nginx:stable-alpine
    container_name: nginx-container-phonebook
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php81-fpm
    networks:
      - nginx-php81-mysql8-redis

  php81-fpm:
    build:
      args:
        PUID: ${PUID}
        PGID: ${PGID}
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: php81-container-phonebook
    command: ["php-fpm"]
    ports:
      - "9001:9000"
    volumes:
      - ./:/var/www/html
    networks:
      - nginx-php81-mysql8-redis

  mysql8:
    image: mysql:8.0.39
    container_name: mysql8-container-phonebook
    ports:
      - "33306:3306"
    volumes:
      # - ./docker/backups:/docker-entrypoint-initdb.d
      - ./docker/mysql:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    networks:
      - nginx-php81-mysql8-redis

  redis:
    image: redis:latest
    container_name: redis-container-phonebook
    ports:
      - "${REDIS_PORT}:${REDIS_DOCKER_PORT}"
    volumes:
      - ./docker/redis/data:/data
    command: redis-server --appendonly yes
    networks:
      - nginx-php81-mysql8-redis

networks:
  nginx-php81-mysql8-redis:

volumes:
  mysql:
